<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <style>
	.box { fill:#f5f7fb; stroke:#2b6cb0; stroke-width:2; rx:8; }
	.label { font: 16px Arial, sans-serif; fill:#1a202c; }
	.small { font: 12px Arial, sans-serif; fill:#1a202c; }
	.arrow { stroke:#2d3748; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>
  <defs>
	<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
	  <polygon points="0 0, 10 3.5, 0 7" fill="#2d3748"/>
	</marker>
  </defs>

  <!-- Boxes -->
  <rect x="40" y="40" width="160" height="60" class="box"/>
  <text x="120" y="70" text-anchor="middle" class="label">Frontend</text>
  <text x="120" y="90" text-anchor="middle" class="small">(UI)</text>

  <rect x="260" y="20" width="240" height="80" class="box"/>
  <text x="380" y="50" text-anchor="middle" class="label">ApiController</text>
  <text x="380" y="70" text-anchor="middle" class="small">GET /api/passages/{id}</text>

  <rect x="260" y="120" width="240" height="80" class="box"/>
  <text x="380" y="150" text-anchor="middle" class="label">ApiController</text>
  <text x="380" y="170" text-anchor="middle" class="small">POST /api/passages/submit</text>

  <rect x="540" y="40" width="200" height="60" class="box"/>
  <text x="640" y="70" text-anchor="middle" class="label">PassageRepository</text>
  <text x="640" y="90" text-anchor="middle" class="small">(IPassageRepository)</text>

  <rect x="540" y="140" width="200" height="60" class="box"/>
  <text x="640" y="170" text-anchor="middle" class="label">GradingService</text>
  <text x="640" y="190" text-anchor="middle" class="small">(IGradingService)</text>

  <rect x="760" y="90" width="180" height="80" class="box"/>
  <text x="850" y="120" text-anchor="middle" class="label">AppDbContext</text>
  <text x="850" y="140" text-anchor="middle" class="small">Passages, Questions</text>

  <!-- Arrows: GET flow -->
  <path d="M200 70 L260 70" class="arrow"/>
  <path d="M500 70 L540 70" class="arrow"/>
  <path d="M740 110 L760 110" class="arrow"/>
  <path d="M760 110 L760 150" class="arrow"/>

  <!-- GET response arrows back -->
  <path d="M760 150 L740 150 L500 150 L260 150 L200 150" class="arrow"/>

  <!-- Arrows: POST flow -->
  <path d="M200 110 L260 150" class="arrow"/>
  <path d="M500 150 L540 170" class="arrow"/>
  <path d="M740 170 L760 130" class="arrow"/>

  <!-- Response arrows: POST -->
  <path d="M760 130 L740 130 L500 110 L260 110 L200 110" class="arrow"/>

  <!-- Notes -->
  <rect x="40" y="220" width="900" height="140" rx="8" fill="#fff8dc" stroke="#b7791f"/>
  <text x="60" y="245" class="label">Validation & Scoring (GradingService)</text>
  <text x="60" y="270" class="small">- duplicate answers</text>
  <text x="60" y="290" class="small">- unknown question ids</text>
  <text x="60" y="310" class="small">- SelectedAnswer bounds (uses AnswerChoicesCount)</text>
  <text x="60" y="330" class="small">- compares SelectedAnswer to CorrectChoice -> builds SubmissionFeedbackDto</text>

  <text x="60" y="380" class="small">Notes: Repository projects EF entities into DTOs (PassageForReviewDto, PassageForGradingDto). Questions are ordered by Position for deterministic UI display.</text>

</svg>
